name: Validate semantic decks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run example:relationships
      - run: npm run example:research
      - run: npm run example:decomposition
      - name: Upload reproducible sample decks and reports
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: semantic-deck-samples
          path: |
            examples/relationships/generated/
            examples/research/generated/
            examples/decomposition/generated/
          if-no-files-found: error
          retention-days: 14
